[project]
name = "arcosparse"
version = "0.5.1"
description = "Helper to download and subset sparse data that has been Arcoified and are available through STAC and sqlite formated data"
authors = [{name = "renaudjester",  email = "renaud.jester@lobelia.earth"}, {name = "Lobelia", email = "developer@lobelia.earth"}]
readme = "README.md"
requires-python = ">=3.9"
packages = [{include = "src/arcosparse", from = "src"}]
license = "EUPL-1.2"
dependencies = ["dask[dataframe] (>=2026.8.0,<2027.0.0)"]

[project.optional-dependencies]
# Enables arcosparse.subset_and_return_dask_dataframe for lazy, distributed
# per-chunk downloading. Install with: pip install "arcosparse[dask]"
dask = ["dask[dataframe]>=2024.1.0"]

[tool.poetry.dependencies]
python = ">=3.10"
pandas = ">=2"
pystac = "^1.8.3"
pyarrow = ">=17.0.0"
tqdm = "^4.65"
boto3 = ">=1.26"
certifi = ">=2017.4.17"
dask = "^2026.8.0"
s3fs = "^2026.9.0"


[tool.poetry.group.dev.dependencies]
black = "^24.10.0"
isort = "^5.13.2"
flake8 = "^7.1.1"
bandit = "^1.8.2"
pyright = "^1.1.391"
pytest = "^8.3.4"
syrupy = "^4.9.1"
python-dotenv = "^1.2.1"
dask = {version = ">=2024.1.0", extras = ["dataframe"]}


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 79

[tool.isort]
profile = "black"
line_length = 79
